name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 저장소 읽기 권한만 (토큰으로 코드를 바꾸거나 릴리스를 만들 수 없게)
permissions:
  contents: read

# 동시에 두 빌드가 돌면 서로가 만든 서명 인증서를 폐기할 수 있어서 한 번에 하나씩
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is empty (check the secret name in repo settings)"
              missing=1
            else
              echo "::notice title=Secret OK::$name is set"
            fi
          done
          exit $missing

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # 붙여넣기 형태가 달라도 올바른 .p8(PEM)로 정리 (키 값은 로그에 출력하지 않음)
          python3 - "$KEY_FILE" <<'PY'
          import os, re, sys, base64
          raw = os.environ["ASC_KEY_CONTENT"].strip().strip('"').strip("'")
          raw = raw.replace("\\r", "").replace("\r", "").replace("\\n", "\n")
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(raw, validate=False).decode("utf-8")
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          # 앞뒤에 섞인 글자 제거: PKCS#8 키는 "MIG"로 시작하고 DER 길이 정보로 끝을 알 수 있음
          start = body.find("MIG")
          extra_front = max(start, 0)
          if start > 0:
              body = body[start:]
          try:
              padded = body + "=" * (-len(body) % 4)
              der = base64.b64decode(padded[: (len(padded) // 4) * 4])
              if der[0] == 0x30 and der[1] == 0x81:
                  total = der[2] + 3
                  der = der[:total]
                  extra_back = len(body) - len(base64.b64encode(der).decode())
                  body = base64.b64encode(der).decode()
                  print(f"::notice title=API key::앞쪽 여분 {extra_front}자, 뒤쪽 여분 {max(extra_back, 0)}자를 제거 · 키 길이 {total}바이트")
          except Exception as e:
              print(f"::warning title=API key::키 구조를 읽지 못했어요 ({type(e).__name__})")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print(f"::notice title=API key::header={'BEGIN' in os.environ['ASC_KEY_CONTENT']} base64_chars={len(body)} lines={len(lines)}")
          if len(body) < 150:
              print("::error title=API key::키 내용이 너무 짧아요. .p8 파일을 메모장으로 열어 전체를 붙여넣었는지 확인해주세요.")
              sys.exit(1)
          PY
          echo "::notice title=Key ID::length=${#ASC_KEY_ID} (보통 10자)"
          echo "::notice title=Issuer ID::length=${#ASC_ISSUER_ID} (보통 36자)"
          echo "::notice title=Team ID::length=${#TEAM_ID} (보통 10자)"

      - name: Set build number
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" DOOOIT.xcodeproj/project.pbxproj

      - name: Prepare provisioning folders
        run: |
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Record certificates before build
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          python3 .github/scripts/asc_certs.py list
          python3 .github/scripts/asc_certs.py snapshot "$RUNNER_TEMP/certs-before.json"

      # 빌드 속도: 받은 패키지(MLX 등)와 컴파일 캐시(Xcode 26 compilation caching, DerivedData/CompilationCache.noindex)를
      # 다음 빌드에 다시 씀. archive는 중간 결과를 새로 만들지만, 컴파일 캐시는 같은 입력이면 결과를 그대로 꺼내 씀
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/spm
            ${{ runner.temp }}/dd
          key: build-${{ runner.os }}-xcode26-${{ hashFiles('DOOOIT.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-xcode26-${{ hashFiles('DOOOIT.xcodeproj/project.pbxproj') }}-
            build-${{ runner.os }}-xcode26-

      - name: Archive
        run: |
          set -o pipefail
          archive() {
          xcodebuild archive \
            -project DOOOIT.xcodeproj \
            -scheme DOOOIT \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DOOOIT.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic 2>&1 | tee "$RUNNER_TEMP/archive.log"
          }
          # 처음 빌드 때는 Apple에서 프로비저닝 프로필을 새로 만들면서 실패할 수 있어 한 번 더 시도
          # (코드 오류로 실패했으면 다시 해도 같으니 바로 끝냄 — 시간 절약)
          archive || { ! grep -qE "\.swift:[0-9]+:[0-9]+: error:" "$RUNNER_TEMP/archive.log" && echo "::notice title=Archive::첫 시도 실패, 프로필을 받은 뒤 다시 시도해요" && sleep 10 && archive; } || {
              grep -E "error:|Error |\*\* ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -40 | while IFS= read -r line; do
                echo "::error title=Archive::${line:0:900}"
              done
              exit 1
            }

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DOOOIT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -30 | while IFS= read -r line; do
                echo "::error title=Upload::${line:0:900}"
              done
              exit 1
            }

      # 빌드용 Mac은 매번 새것이라 서명 인증서를 새로 만들어요. 그 인증서의 키는 이 Mac에만 있어
      # 빌드가 끝나면 다시 쓸 수 없으니, 이번 빌드가 만든 것만 폐기해 한도(최대 개수)가 차지 않게 함
      - name: Revoke certificates created by this build
        if: always()
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          [ -f "$ASC_KEY_FILE" ] || exit 0
          python3 .github/scripts/asc_certs.py cleanup "$RUNNER_TEMP/certs-before.json"

      # 개인 키 파일과 빌드 로그를 지움 (러너는 매번 새것이지만 남겨둘 이유가 없음)
      - name: Remove signing key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log"
