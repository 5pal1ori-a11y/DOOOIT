name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Claude 문제 읽기 서버 (server/README.md). 비어 있으면 기기 안 인식만 사용
      READER_URL: ${{ secrets.DOOOIT_READER_URL }}
      READER_KEY: ${{ secrets.DOOOIT_READER_KEY }}
      # 이 세 개를 넣으면 빌드할 때 Claude 서버(server/)를 Cloudflare에 자동 배포하고 앱에 연결
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is empty (check the secret name in repo settings)"
              missing=1
            else
              echo "::notice title=Secret OK::$name is set"
            fi
          done
          # 선택: Claude 서버 자동 배포용 (값은 출력하지 않고 들어 있는지만 표시)
          for name in ANTHROPIC_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning title=Claude secret::$name 비어 있음 (Settings > Secrets and variables > Actions > Repository secrets 에 정확히 이 이름으로)"
            else
              echo "::notice title=Claude secret::$name 들어 있음"
            fi
          done
          exit $missing

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # 붙여넣기 형태가 달라도 올바른 .p8(PEM)로 정리 (키 값은 로그에 출력하지 않음)
          python3 - "$KEY_FILE" <<'PY'
          import os, re, sys, base64
          raw = os.environ["ASC_KEY_CONTENT"].strip().strip('"').strip("'")
          raw = raw.replace("\\r", "").replace("\r", "").replace("\\n", "\n")
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(raw, validate=False).decode("utf-8")
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          # 앞뒤에 섞인 글자 제거: PKCS#8 키는 "MIG"로 시작하고 DER 길이 정보로 끝을 알 수 있음
          start = body.find("MIG")
          extra_front = max(start, 0)
          if start > 0:
              body = body[start:]
          try:
              padded = body + "=" * (-len(body) % 4)
              der = base64.b64decode(padded[: (len(padded) // 4) * 4])
              if der[0] == 0x30 and der[1] == 0x81:
                  total = der[2] + 3
                  der = der[:total]
                  extra_back = len(body) - len(base64.b64encode(der).decode())
                  body = base64.b64encode(der).decode()
                  print(f"::notice title=API key::앞쪽 여분 {extra_front}자, 뒤쪽 여분 {max(extra_back, 0)}자를 제거 · 키 길이 {total}바이트")
          except Exception as e:
              print(f"::warning title=API key::키 구조를 읽지 못했어요 ({type(e).__name__})")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print(f"::notice title=API key::header={'BEGIN' in os.environ['ASC_KEY_CONTENT']} base64_chars={len(body)} lines={len(lines)}")
          if len(body) < 150:
              print("::error title=API key::키 내용이 너무 짧아요. .p8 파일을 메모장으로 열어 전체를 붙여넣었는지 확인해주세요.")
              sys.exit(1)
          PY
          echo "::notice title=Key ID::length=${#ASC_KEY_ID} (보통 10자)"
          echo "::notice title=Issuer ID::length=${#ASC_ISSUER_ID} (보통 36자)"
          echo "::notice title=Team ID::length=${#TEAM_ID} (보통 10자)"

      - name: Set build number
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" DOOOIT.xcodeproj/project.pbxproj

      - name: Prepare provisioning folders
        run: |
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != '' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20

      - name: Deploy Claude reader server
        if: env.ANTHROPIC_API_KEY != '' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        run: |
          set -eo pipefail
          # 앱 키: DOOOIT_READER_KEY 시크릿이 있으면 그 값, 없으면 Anthropic 키에서 만든 해시 (원래 키는 알 수 없음)
          if [ -n "$READER_KEY" ]; then
            APP_KEY="$READER_KEY"
          else
            APP_KEY=$(printf 'dooit-reader:%s' "$ANTHROPIC_API_KEY" | shasum -a 256 | cut -c1-48)
          fi
          echo "::add-mask::$APP_KEY"
          npm ci --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$URL" ]; then
            echo "::error title=Claude 서버::배포 주소를 찾지 못했어요. Cloudflare 대시보드에서 Workers & Pages를 한 번 열어 workers.dev 하위 도메인을 정해주세요."
            exit 1
          fi
          APP_KEY="$APP_KEY" python3 -c 'import json,os; json.dump({"ANTHROPIC_API_KEY": os.environ["ANTHROPIC_API_KEY"], "APP_KEY": os.environ["APP_KEY"]}, open(os.environ["RUNNER_TEMP"] + "/worker-secrets.json", "w"))'
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)
          echo "Claude 서버: $URL (health $code)"
          echo "CLAUDE_URL=$URL" >> "$GITHUB_ENV"
          echo "CLAUDE_KEY=$APP_KEY" >> "$GITHUB_ENV"

      - name: Record certificates before build
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          python3 .github/scripts/asc_certs.py list
          python3 .github/scripts/asc_certs.py snapshot "$RUNNER_TEMP/certs-before.json"

      - name: Archive
        run: |
          set -o pipefail
          archive() {
          xcodebuild archive \
            -project DOOOIT.xcodeproj \
            -scheme DOOOIT \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DOOOIT.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            DOOOIT_READER_URL="${CLAUDE_URL:-$READER_URL}" \
            DOOOIT_READER_KEY="${CLAUDE_KEY:-$READER_KEY}" \
            CODE_SIGN_STYLE=Automatic 2>&1 | tee "$RUNNER_TEMP/archive.log"
          }
          # 처음 빌드 때는 Apple에서 프로비저닝 프로필을 새로 만들면서 실패할 수 있어 한 번 더 시도
          archive || { echo "::notice title=Archive::첫 시도 실패, 프로필을 받은 뒤 다시 시도해요"; sleep 10; archive; } || {
              grep -E "error:|Error |\*\* ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -40 | while IFS= read -r line; do
                echo "::error title=Archive::${line:0:900}"
              done
              exit 1
            }

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DOOOIT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -30 | while IFS= read -r line; do
                echo "::error title=Upload::${line:0:900}"
              done
              exit 1
            }

      # 빌드용 Mac은 매번 새것이라 서명 인증서를 새로 만들어요. 그 인증서의 키는 이 Mac에만 있어
      # 빌드가 끝나면 다시 쓸 수 없으니, 이번 빌드가 만든 것만 폐기해 한도(최대 개수)가 차지 않게 함
      - name: Revoke certificates created by this build
        if: always()
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          [ -f "$ASC_KEY_FILE" ] || exit 0
          python3 .github/scripts/asc_certs.py cleanup "$RUNNER_TEMP/certs-before.json"
