name: Figure eval (그림 읽기)

# 그림·그래프·차트·표 읽기 확인: 테스트 그림 20장을 앱 코드 그대로 기본 판독(Vision) · 정밀 인식(PaddleOCR-VL) · 두잇 2(Qwen3.5 4B 사진 읽기)로 읽고 정답과 비교
# 결과는 로그의 FIG · SUMMARY · MEMORY 줄
on:
  workflow_dispatch:
  push:
    branches:
      - "figure-eval*"

permissions:
  contents: read

concurrency:
  group: figure-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompts:
    # 정밀 인식 지시문 확인 (모델 설명·mlx-vlm에 적힌 표·차트 지시)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PaddleOCR-VL 지시문
        run: |
          for r in PaddlePaddle/PaddleOCR-VL mlx-community/PaddleOCR-VL-1.6-4bit PaddlePaddle/PaddleOCR-VL-1.5; do
            echo "== $r"
            curl -sfL "https://huggingface.co/$r/raw/main/README.md" | grep -n -i "recognition:\|spotting:\|OCR:\|prompt" | head -30 || echo "없음"
          done
          mkdir -p /tmp/mv
          pip download --no-deps "mlx-vlm==0.7.11" -d /tmp/mv >/dev/null 2>&1 || true
          (cd /tmp/mv && unzip -q -o ./*.whl -d src && grep -rn "Recognition:" src | head -20) || true

  eval:
    runs-on: macos-26
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - which: vision
            side: ""
          - which: paddle
            side: ""
          - which: vlm
            side: "1024"
          - which: vlm
            side: "768"
    name: eval ${{ matrix.which }} ${{ matrix.side }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version; sw_vers; sysctl -n hw.memsize; sysctl -n machdep.cpu.brand_string
      # 앱의 그림 읽기 연결 코드(FigureReader · VisionAnalyzer · FigureVision)를 iOS로 형 검사 (MLX·모델 쪽은 가짜로)
      - name: Type-check figure files for iOS
        if: matrix.which == 'vision'
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator swiftc -typecheck -swift-version 5 -sdk "$SDK" -target arm64-apple-ios26.0-simulator \
            DOOOIT/Services/FigureReader.swift DOOOIT/Services/FigureVision.swift DOOOIT/Services/VisionAnalyzer.swift \
            DOOOIT/Services/VisionCore/*.swift DOOOIT/Services/DoitAI/Mistake/DoitFigureFacts.swift DOOOIT/Services/GeometryText.swift \
            Tests/FigureEval/iOSStubs.swift
          echo "iOS 형 검사 통과"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fig/dd/SourcePackages
          key: figure-eval-spm-${{ hashFiles('Tests/FigureEval/Package.swift') }}
      - name: 읽기 · 채점
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          FIG_SIDE: ${{ matrix.side }}
        run: bash Tests/FigureEval/run.sh "$RUNNER_TEMP/fig" "${{ matrix.which }}"
