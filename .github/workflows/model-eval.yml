name: Model eval (두잇 1·2)

# 두잇 1·2 모델 바꾸기 확인: 앱(DoitBrain)과 똑같이 mlx-swift-lm으로 불러와 답을 만들고, 문제 풀이 정답률 비교용 답을 로그에 남김
# 채점은 리눅스 도구(Tests/ModelEval/linux.sh score)로 로그의 EVAL 줄을 모아서
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "문제 수 (0이면 전부)"
        required: false
        default: "0"
  push:
    branches:
      - "model-eval*"
    paths:
      - ".github/workflows/model-eval.yml"
      - "Tests/ModelEval/**"
      - "DOOOIT/Services/DoitBrain/**"

permissions:
  contents: read

concurrency:
  group: model-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repos:
    # Hugging Face에서 Qwen3.5 저장소 찾기 (이름이 맞는지, 무슨 모델 형식인지)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: mlx-community Qwen3.5 저장소
        run: |
          for q in "Qwen3.5-4B" "Qwen3.5-2B"; do
            echo "== search $q"
            curl -sfL "https://huggingface.co/api/models?author=mlx-community&search=$q&limit=50" | python3 -c "import json,sys; [print(m['id'], m.get('downloads'), m.get('lastModified','')) for m in json.load(sys.stdin)]" || echo "검색 실패"
          done
          echo "== search Qwen (official) Qwen3.5-4B MLX"
          curl -sfL "https://huggingface.co/api/models?author=Qwen&search=Qwen3.5-4B&limit=50" | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]" || true
          for r in mlx-community/Qwen3.5-2B-4bit mlx-community/Qwen3.5-4B-MLX-4bit mlx-community/Qwen3.5-4B-4bit mlx-community/Qwen3-1.7B-4bit; do
            echo "== $r"
            curl -sfL "https://huggingface.co/api/models/$r?blobs=true" | python3 -c "
          import json,sys
          m=json.load(sys.stdin)
          files=[(s['rfilename'], s.get('size') or 0) for s in m.get('siblings',[])]
          print('files:', ', '.join(f for f,_ in files))
          print('safetensors MB: %.0f' % (sum(sz for f,sz in files if f.endswith('.safetensors'))/1048576))
          " || echo "없음 (404)"
            curl -sfL "https://huggingface.co/$r/resolve/main/config.json" | python3 -c "
          import json,sys
          c=json.load(sys.stdin)
          t=c.get('text_config',{})
          print('model_type', c.get('model_type'), '| text_config.model_type', t.get('model_type'), '| vision_config', 'vision_config' in c, '| quantization', c.get('quantization') or c.get('quantization_config'))
          print('layers', c.get('num_hidden_layers', t.get('num_hidden_layers')), 'hidden', c.get('hidden_size', t.get('hidden_size')), 'layer_types', str(t.get('layer_types', c.get('layer_types')))[:200])
          " || true
          done

  swift:
    runs-on: macos-26
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "old-dooit2-Qwen3-1.7B"
            repo: "mlx-community/Qwen3-1.7B-4bit"
          - label: "new-dooit1-Qwen3.5-2B"
            repo: "mlx-community/Qwen3.5-2B-4bit"
          - label: "new-dooit2-Qwen3.5-4B"
            repo: "mlx-community/Qwen3.5-4B-MLX-4bit"
    name: swift ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version; sw_vers; sysctl -n hw.memsize; sysctl -n machdep.cpu.brand_string
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eval/dd/SourcePackages
          key: model-eval-spm-${{ hashFiles('Tests/ModelEval/Package.swift') }}
      - name: 불러오기 · 답 만들기 · 문제 풀기
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          bash Tests/ModelEval/mac.sh "$RUNNER_TEMP/eval" "${{ matrix.repo }}" "${{ matrix.label }}" "$LIMIT"
