# (백업용) DOOOIT.xcodeproj가 열리지 않을 때: brew install xcodegen && xcodegen generate
name: DOOOIT
options:
  bundleIdPrefix: com.donghyeon
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DOOOIT_APPLOCK_SUFFIX: ""
    # 애플 워치 컴플리케이션이 워치 앱 자료를 읽으려면 App Group이 필요 (개발자 계정에 그룹을 만든 뒤 "-AppGroup")
    DOOOIT_WATCH_GROUP_SUFFIX: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # 두잇 AI 두뇌 (기기 안 오픈소스 언어 모델)
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    majorVersion: 1.0.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minorVersion: 1.3.5
  # 정밀 인식 (PaddleOCR-VL): 모델 코드를 앱 안에 두고 MLX를 바로 씀 (mlx-swift-lm과 같은 버전 범위)
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
targets:
  DOOOIT:
    type: application
    platform: iOS
    sources:
      - DOOOIT
      - Shared
      - WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donghyeon.moti
        INFOPLIST_FILE: Config/DOOOIT-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MOTI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Config/DOOOIT$(DOOOIT_APPLOCK_SUFFIX).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-midnight AppIcon-forest AppIcon-ocean"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # 앱 코드는 파일별로 나눠 컴파일 (여러 코어로 빨리, 바뀐 파일만 다시) — MLX 패키지는 그대로 최적화
          SWIFT_COMPILATION_MODE: singlefile
          # 앱 코드는 최적화 없이 (컴파일 3.7배 빠름, 실행은 약 20% 느림 — 측정) · MLX 패키지는 그대로 -O
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      # 두잇 2(Qwen3.5 4B)로 문제 그림 읽기 (DoitVision)
      - package: mlx-swift-lm
        product: MLXVLM
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
      - target: DOOOITWidgetsExtension
        embed: true
      - target: DOOOITActivityMonitor
        embed: true
      # 애플 워치 앱 (Watch 폴더에 넣음)
      - target: DOOOITWatch
  DOOOITWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - DOOOITWidgets
      - Shared
      # 번역 도우미(AppLocale) 같이 씀
      - WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donghyeon.moti.widgets
        INFOPLIST_FILE: Config/DOOOITWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MOTI Widgets
        CODE_SIGN_ENTITLEMENTS: Config/DOOOITWidgets.entitlements
        SKIP_INSTALL: YES
  DOOOITActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - DOOOITActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donghyeon.moti.activitymonitor
        INFOPLIST_FILE: Config/DOOOITActivityMonitor-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MOTI App Lock
        CODE_SIGN_ENTITLEMENTS: Config/DOOOITActivityMonitor$(DOOOIT_APPLOCK_SUFFIX).entitlements
        SKIP_INSTALL: YES
  # 애플 워치 앱: 타이머 리모컨 · 오늘 할 일 · 단어 카드 (WatchConnectivity로 아이폰 앱과 연결)
  DOOOITWatch:
    type: application
    platform: watchOS
    sources:
      - DOOOITWatch
      - WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donghyeon.moti.watchkitapp
        INFOPLIST_FILE: Config/DOOOITWatch-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MOTI
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.donghyeon.moti
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        CODE_SIGN_ENTITLEMENTS: Config/DOOOITWatch$(DOOOIT_WATCH_GROUP_SUFFIX).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: DOOOITWatchWidgetsExtension
        embed: true
  # 워치 페이스 컴플리케이션 · 스마트 스택 (오늘 공부 시간 · 목표 고리)
  DOOOITWatchWidgetsExtension:
    type: app-extension
    platform: watchOS
    sources:
      - DOOOITWatchWidgets
      - WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donghyeon.moti.watchkitapp.widgets
        INFOPLIST_FILE: Config/DOOOITWatchWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MOTI Widgets
        CODE_SIGN_ENTITLEMENTS: Config/DOOOITWatch$(DOOOIT_WATCH_GROUP_SUFFIX).entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
